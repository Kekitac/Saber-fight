<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saber Showdown Locked Camera</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #e0e5ff; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Интерфейс статусов */
        #ui-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; color: #111; font-weight: bold; text-shadow: 0 1px 2px rgba(255,255,255,0.6); font-size: 16px; z-index: 10; pointer-events: none;}
        .bar-container { margin-top: 5px; }
        .hp-bar { background: rgba(0,0,0,0.2); width: 130px; height: 14px; border-radius: 4px; border: 2px solid #111; overflow: hidden; }
        .stamina-bar { background: rgba(0,0,0,0.2); width: 130px; height: 8px; border-radius: 4px; border: 2px solid #111; overflow: hidden; margin-top: 4px; }
        .fill { height: 100%; width: 100%; transition: width 0.1s; }
        #player-hp { background: #00cc99; }
        #enemy-hp { background: #ff0055; }
        .stamina-fill { background: #ffaa00; }
        #stun-alert { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); color: #ff0055; font-size: 24px; font-weight: bold; display: none; text-shadow: 0 0 10px #ff0000; pointer-events: none;}
        
        /* Инструкция */
        #cam-hint { position: absolute; top: 140px; left: 50%; transform: translateX(-50%); color: rgba(0,0,0,0.5); font-size: 12px; pointer-events: none; text-align: center; font-weight: bold;}

        /* Кнопки управления */
        .controls-container { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; z-index: 10; }
        .dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 8px; pointer-events: auto; }
        .actions { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; justify-content: center;}
        
        .btn { background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(0,0,0,0.8); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: rgba(0, 0, 0, 0.8); transform: scale(0.95); }
        .action-btn { width: 95px; height: 50px; border-radius: 12px; font-size: 13px; }

        #btn-attack { background: rgba(255, 0, 85, 0.7); border-color: #ff0055; }
        #btn-block { background: rgba(0, 150, 255, 0.7); border-color: #00ccff; }
        #btn-dash { background: rgba(255, 130, 0, 0.7); border-color: #ff9900; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div>You
            <div class="bar-container">
                <div class="hp-bar"><div id="player-hp" class="fill"></div></div>
                <div class="stamina-bar"><div id="player-stamina" class="fill stamina-fill"></div></div>
            </div>
        </div>
        <div>Bot
            <div class="bar-container">
                <div class="hp-bar"><div id="enemy-hp" class="fill"></div></div>
                <div class="stamina-bar"><div id="enemy-stamina" class="fill stamina-fill"></div></div>
            </div>
        </div>
    </div>

    <div id="stun-alert">ОГЛУШЕН!</div>
    <div id="cam-hint">📱 Крути влево/вправо вверху экрана, чтобы вращать обзор вокруг головы</div>

    <div class="controls-container">
        <div class="dpad">
            <div></div><div class="btn" id="btn-up">▲</div><div></div>
            <div class="btn" id="btn-left">◀</div><div></div><div class="btn" id="btn-right">▶</div>
            <div></div><div class="btn" id="btn-down">▼</div><div></div>
        </div>
        <div class="actions">
            <div class="btn action-btn" id="btn-dash">Dash</div>
            <div class="btn action-btn" id="btn-attack">Hit</div>
            <div class="btn action-btn" id="btn-block">Block</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e5ff); 
        scene.fog = new THREE.FogExp2(0xe0e5ff, 0.015);

        // --- ОБНОВЛЕННАЯ СИСТЕМА ПРИВЯЗАННОЙ КАМЕРЫ (LOCKED ON HEAD) ---
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const cameraPivot = new THREE.Group();
        scene.add(cameraPivot);
        cameraPivot.add(camera);
        
        let camAngleY = 0; // Вращение только влево/вправо
        const FIXED_ANGLE_X = 0.45; // Залоченный фиксированный угол наклона сверху вниз
        
        // Отодвигаем камеру назад и чуть вверх внутри пивота
        camera.position.set(0, 3.5, 7.5); 
        camera.lookAt(0, 1.2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xa0a0ff, 0.8);
        scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; 
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Чистый белый пол
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(150, 150), 
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        scene.add(new THREE.GridHelper(150, 60, 0x00ccff, 0xcccccc));

        // Функция создания персонажа (Перпендикулярные саберы сохранены!)
        function createRobloxCharacter(shirtColor, pantsColor, saberColor) {
            const group = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.5 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.6 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.6 });

            // Торс
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), shirtMat);
            torso.position.y = 1.1;
            torso.castShadow = torso.receiveShadow = true;
            group.add(torso);

            // Голова
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
            head.position.y = 1.85;
            head.castShadow = true;
            group.add(head);

            // Руки
            const rArmPivot = new THREE.Group(); rArmPivot.position.set(0.55, 1.5, 0);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.9, 0.24), shirtMat); rArm.position.y = -0.45; rArm.castShadow = true;
            rArmPivot.add(rArm); group.add(rArmPivot);

            const lArmPivot = new THREE.Group(); lArmPivot.position.set(-0.55, 1.5, 0);
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.9, 0.24), shirtMat); lArm.position.y = -0.45; lArm.castShadow = true;
            lArmPivot.add(lArm); group.add(lArmPivot);

            // Ноги
            const rLegPivot = new THREE.Group(); rLegPivot.position.set(0.2, 0.6, 0);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.7, 0.28), pantsMat); rLeg.position.y = -0.35; rLeg.castShadow = true;
            rLegPivot.add(rLeg); group.add(rLegPivot);

            const lLegPivot = new THREE.Group(); lLegPivot.position.set(-0.2, 0.6, 0);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.7, 0.28), pantsMat); lLeg.position.y = -0.35; lLeg.castShadow = true;
            lLegPivot.add(lLeg); group.add(lLegPivot);

            // МЕЧ ИЗ КИСТИ (ПЕРПЕНДИКУЛЯРНО)
            const saberHolder = new THREE.Group();
            saberHolder.position.set(0, -0.9, 0.05); 

            const handleGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.7 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.rotation.x = Math.PI / 2; 
            saberHolder.add(handle);

            const bladeGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.4, 8);
            const bladeMat = new THREE.MeshBasicMaterial({ color: saberColor });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.z = 0.7; 
            blade.rotation.x = Math.PI / 2;
            saberHolder.add(blade);

            const light = new THREE.PointLight(saberColor, 1.5, 4);
            light.position.z = 0.5;
            saberHolder.add(light);

            rArmPivot.add(saberHolder);

            group.userData = { head, rArmPivot, lArmPivot, rLegPivot, lLegPivot, blade, saberColor };
            return group;
        }

        const player = createRobloxCharacter(0x0055ff, 0x222222, 0x00ffcc);
        const enemy = createRobloxCharacter(0xff2233, 0x111111, 0xff0055);
        player.position.set(0, 0, 3);
        enemy.position.set(0, 0, -3);
        scene.add(player);
        scene.add(enemy);

        // --- СВАЙПЫ ТОЛЬКО ВЛЕВО И ВПРАВО (ГОРИЗОНТАЛЬ) ---
        let isDragging = false;
        let prevTouchX = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientY < window.innerHeight * 0.65) {
                isDragging = true;
                prevTouchX = e.touches[0].clientX;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - prevTouchX;
            
            // Вращаем только вокруг вертикальной оси
            camAngleY -= deltaX * 0.008;
            prevTouchX = e.touches[0].clientX;
        });

        window.addEventListener('touchend', () => isDragging = false);

        // Мышь для тестов ПК
        window.addEventListener('mousedown', (e) => { if(e.clientY < window.innerHeight * 0.65) { isDragging = true; prevTouchX = e.clientX; } });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            camAngleY -= (e.clientX - prevTouchX) * 0.007;
            prevTouchX = e.clientX;
        });
        window.addEventListener('mouseup', () => isDragging = false);

        // --- ГЕЙМПЛЕЙНЫЙ ДВИЖОК ---
        const state = {
            player: { hp: 100, stamina: 100, isAttacking: false, combo: 0, isBlocking: false, isStunned: false, stunTimer: 0, attackTimer: 0, dashTimer: 0, isMoving: false },
            enemy: { hp: 100, stamina: 100, isAttacking: false, combo: 0, isBlocking: false, isStunned: false, stunTimer: 0, attackTimer: 0, dashTimer: 0, isMoving: false },
            input: { forward: 0, backward: 0, left: 0, right: 0 }
        };

        const keys = { "btn-up": 'forward', "btn-down": 'backward', "btn-left": 'left', "btn-right": 'right' };
        Object.keys(keys).forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); state.input[keys[id]] = 1; });
            btn.addEventListener('touchend', () => state.input[keys[id]] = 0);
            btn.addEventListener('mousedown', () => state.input[keys[id]] = 1);
            btn.addEventListener('mouseup', () => state.input[keys[id]] = 0);
        });

        document.getElementById('btn-attack').addEventListener('touchstart', (e) => { e.preventDefault(); triggerAttack(state.player); });
        document.getElementById('btn-attack').addEventListener('mousedown', () => triggerAttack(state.player));
        document.getElementById('btn-dash').addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(state.player); });
        document.getElementById('btn-dash').addEventListener('mousedown', () => triggerDash(state.player));

        const blockBtn = document.getElementById('btn-block');
        blockBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!state.player.isStunned) state.player.isBlocking = true; });
        blockBtn.addEventListener('touchend', () => state.player.isBlocking = false);
        blockBtn.addEventListener('mousedown', () => { if(!state.player.isStunned) state.player.isBlocking = true; });
        blockBtn.addEventListener('mouseup', () => state.player.isBlocking = false);

        function triggerAttack(charState) {
            if (charState.isStunned || charState.isBlocking || charState.isAttacking || charState.stamina < 15) return;
            charState.isAttacking = true; charState.attackTimer = 0; charState.stamina -= 15;
        }

        function triggerDash(charState) {
            if (charState.isStunned || charState.dashTimer > 0 || charState.stamina < 20) return;
            charState.dashTimer = 0.2; charState.stamina -= 20;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            if (state.player.hp <= 0 || state.enemy.hp <= 0) {
                document.getElementById('ui-overlay').innerHTML = "РАУНД ОКОНЧЕН"; return;
            }

            if (!state.player.isBlocking && !state.player.isStunned) state.player.stamina = Math.min(100, state.player.stamina + 30 * dt);
            if (!state.enemy.isBlocking && !state.enemy.isStunned) state.enemy.stamina = Math.min(100, state.enemy.stamina + 30 * dt);

            handleStun(state.player, player, 'stun-alert', dt);
            handleStun(state.enemy, enemy, null, dt);

            // Передвижение игрока
            let moveSpeed = 4.5;
            if (state.player.dashTimer > 0) { moveSpeed = 16; state.player.dashTimer -= dt; }

            const moveZ = (state.input.backward - state.input.forward) * moveSpeed * dt;
            const moveX = (state.input.right - state.input.left) * moveSpeed * dt;
            
            if (!state.player.isStunned && !state.player.isBlocking) {
                player.position.z += moveZ; player.position.x += moveX;
                state.player.isMoving = (moveZ !== 0 || moveX !== 0);
            } else {
                state.player.isMoving = false;
            }

            player.lookAt(enemy.position.x, player.position.y, enemy.position.z);
            enemy.lookAt(player.position.x, enemy.position.y, player.position.z);

            // --- ЖЕСТКОЕ ЗАКРЕПЛЕНИЕ КАМЕРЫ НА ГОЛОВЕ ИГРОКА (LOCKED THIRD PERSON) ---
            // Точка привязки — это координаты головы игрока (Y + 1.85)
            const headPosition = new THREE.Vector3(player.position.x, player.position.y + 1.85, player.position.z);
            cameraPivot.position.copy(headPosition); 
            
            // Плавное вращение только влево-вправо. Ось X залочена на FIXED_ANGLE_X
            cameraPivot.rotation.y = THREE.MathUtils.lerp(cameraPivot.rotation.y, camAngleY, 0.12);
            cameraPivot.rotation.x = FIXED_ANGLE_X; 

            // Логика бота
            const dist = player.position.distanceTo(enemy.position);
            let botSpeed = 3.2;
            if (state.enemy.dashTimer > 0) { botSpeed = 14; state.enemy.dashTimer -= dt; }

            if (!state.enemy.isStunned) {
                if (dist > 2.0) {
                    state.enemy.isMoving = true; state.enemy.isBlocking = false;
                    const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                    enemy.position.addScaledVector(dir, botSpeed * dt);
                } else {
                    state.enemy.isMoving = false;
                    if (Math.random() < 0.05) triggerAttack(state.enemy);
                    if (Math.random() < 0.02) state.enemy.isBlocking = !state.enemy.isBlocking;
                }
            }

            animateLimbs(player, state.player, time);
            animateLimbs(enemy, state.enemy, time);

            handleCombat(state.player, player, state.enemy, enemy, dt);
            handleCombat(state.enemy, enemy, state.player, player, dt);

            updateUI();
            renderer.render(scene, camera);
        }

        function animateLimbs(obj, charState, time) {
            const p = obj.userData; if (charState.isStunned) return;

            if (charState.isMoving) {
                p.rLegPivot.rotation.x = Math.sin(time * 14) * 0.5;
                p.lLegPivot.rotation.x = -Math.sin(time * 14) * 0.5;
                p.lArmPivot.rotation.x = Math.sin(time * 14) * 0.3;
                
                if (!charState.isAttacking && !charState.isBlocking) {
                    p.rArmPivot.rotation.set(-Math.PI / 3, -Math.PI / 6, 0);
                }
            } else {
                p.rLegPivot.rotation.x = 0; p.lLegPivot.rotation.x = 0; p.lArmPivot.rotation.x = 0;
                
                if (!charState.isAttacking && !charState.isBlocking) {
                    p.rArmPivot.rotation.set(-Math.PI / 2.2, -Math.PI / 6, 0); 
                    p.lArmPivot.rotation.set(0, 0, -0.1);
                }
            }
        }

        function handleStun(charState, charObj, alertId, dt) {
            if (charState.isStunned) {
                charState.stunTimer -= dt;
                charObj.userData.head.rotation.x = 0.5; 
                charObj.userData.rArmPivot.rotation.set(0, 0, -0.4); 
                if (alertId) document.getElementById(alertId).style.display = 'block';
                if (charState.stunTimer <= 0) {
                    charState.isStunned = false; charObj.userData.head.rotation.x = 0;
                    if (alertId) document.getElementById(alertId).style.display = 'none';
                }
            }
        }

        function handleCombat(attState, attObj, defState, defObj, dt) {
            const p = attObj.userData; if (attState.isStunned) return;

            if (attState.isBlocking) {
                p.rArmPivot.rotation.set(-Math.PI / 1.5, 0, Math.PI / 4); 
                return;
            }

            if (attState.isAttacking) {
                attState.attackTimer += dt * 9; 
                
                if (attState.attackTimer < Math.PI) {
                    if (attState.combo === 0) { 
                        p.rArmPivot.rotation.set(-Math.PI/2.5, Math.sin(attState.attackTimer) * 1.8 - 0.9, 0);
                    } else if (attState.combo === 1) { 
                        p.rArmPivot.rotation.set(-Math.PI/2.5, -Math.sin(attState.attackTimer) * 1.8 + 0.9, 0);
                    } else { 
                        p.rArmPivot.rotation.set(-Math.PI / 2 + Math.sin(attState.attackTimer) * 2.0, -Math.PI/6, 0);
                    }
                } else {
                    attState.isAttacking = false;
                    p.rArmPivot.rotation.set(-Math.PI / 2.2, -Math.PI / 6, 0);

                    const dist = attObj.position.distanceTo(defObj.position);
                    if (dist < 2.3) {
                        let damage = attState.combo === 2 ? 22 : 12;

                        if (defState.isBlocking) {
                            defState.stamina -= attState.combo === 2 ? 45 : 20;
                            createClashEffect(attObj.position, defObj.position, p.saberColor);
                            
                            if (defState.stamina <= 0) {
                                defState.stamina = 0; defState.isBlocking = false; defState.isStunned = true;
                                defState.stunTimer = 1.3; 
                            }
                        } else {
                            defState.hp = Math.max(0, defState.hp - damage);
                        }
                    }
                    attState.combo = (attState.combo + 1) % 3; 
                }
            }
        }

        function createClashEffect(p1, p2, color) {
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5); mid.y = 1.2;
            const flash = new THREE.PointLight(color, 6, 4); flash.position.copy(mid);
            scene.add(flash); setTimeout(() => scene.remove(flash), 100);
        }

        function updateUI() {
            document.getElementById('player-hp').style.width = state.player.hp + '%';
            document.getElementById('enemy-hp').style.width = state.enemy.hp + '%';
            document.getElementById('player-stamina').style.width = state.player.stamina + '%';
            document.getElementById('enemy-stamina').style.width = state.enemy.stamina + '%';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
